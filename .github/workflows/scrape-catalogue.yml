# Fills data/collections/*.txt from darsenizami.net and opens a PR.
# Runs on GitHub's network, which can reach the source site and archive.org
# (MEMORY F4) — unlike a local sandbox.
name: Scrape catalogue

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-fetch collections already on disk
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scrape collection pages
        run: node scripts/scrape-catalogue.mjs ${{ inputs.force && '--force' || '' }}
      - name: Rebuild catalogue
        run: node scripts/build-catalogue.mjs
      - name: Show what changed
        run: |
          git diff --stat data/ public/ || true
          node -e "
            const c=require('./public/catalogue.json');
            console.log('collections', c.stats.collectionsImported+'/'+c.stats.collectionsTotal);
            console.log('books', c.stats.books);
            for (const y of c.years) console.log('  ', y.id, y.bookCount, 'books');
          "

      - name: Commit the refreshed catalogue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collections public/catalogue.json public/questions.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "data: refresh Dars-e-Nizami catalogue from darsenizami.net

          Scraped by the scrape-catalogue workflow. Malformed source entries
          are flagged in the collection files rather than dropped (RULES R6.1)."
            git push
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # refreshed catalogue would sit on main undeployed. Kick Pages manually.
      - name: Deploy the refreshed catalogue
        if: success()
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
